[package]
name = "tree-sitter-verilog-ams"
description = "Verilog-AMS grammar for tree-sitter"
version = "0.1.0"
authors = ["Aliaksei Chapyzhenka", "Amaan Qureshi <amaanq12@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "verilog"]
categories = ["parsing", "text-editors"]
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "vendor/verilog/grammar.js", "vendor/verilog/LICENSE", "LICENSE", "queries/**", "src/**", "examples/*", "tree-sitter.json", "README.md"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.26"
