name: Grammar and editor tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Tree-sitter CLI
        run: |
          cargo install tree-sitter-cli --version 0.27.0 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Install portable Neovim
        run: |
          curl -fL https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          tar xzf /tmp/nvim.tar.gz -C /tmp
          echo /tmp/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Generate and check committed parser
        run: |
          make generate
          git diff --exit-code -- src
      - name: Test corpus and Neovim integration
        run: make test
      - name: Test Rust binding
        run: make test-rust
